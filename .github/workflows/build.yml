name: Docker CI
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - 
      name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    - name: Build v10.21
      run: docker build . --pull --tag bshp/firefly:latest --build-arg OCIE_VERSION=26.04 --build-arg TOMCAT_VERSION=10 --build-arg JAVA_VERSION=21 --no-cache
    - name: Push v10.21
      run: |
        docker tag bshp/firefly:latest bshp/firefly:v10.21
        docker push bshp/firefly:v10.21
    - name: Build v11.21
      run: docker build . --pull --tag bshp/firefly:latest --build-arg OCIE_VERSION=26.04 --build-arg TOMCAT_VERSION=11 --build-arg JAVA_VERSION=21 --no-cache
    - name: Push v11.21
      run: |
        docker tag bshp/firefly:latest bshp/firefly:v11.21
        docker push bshp/firefly:latest
        docker push bshp/firefly:v11.21
